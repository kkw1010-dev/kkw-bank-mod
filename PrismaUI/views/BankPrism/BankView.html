<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: transparent; color: #ddd; font-family: 'Malgun Gothic', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }

    .bank-panel {
      background: rgba(20, 24, 30, 0.95);
      border: 2px solid rgba(212, 175, 55, 0.5);
      border-radius: 8px;
      padding: 24px;
      width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
    }

    .title { text-align: center; color: #d4af37; font-size: 20px; margin-bottom: 20px; font-weight: bold; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 10px; }

    .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
    .stat-name { color: #aaa; }
    .stat-value { color: #fff; font-weight: bold; }
    .stat-value.negative { color: #ff6b6b; }

    .input-section {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .amount-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      font-size: 16px;
      text-align: right;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }

    .amount-input:focus { border-color: #d4af37; }

    .btn-row { display: flex; gap: 10px; }

    .action-btn { flex: 1; background: rgba(212, 175, 55, 0.15); color: #d4af37; border: 1px solid rgba(212, 175, 55, 0.4); padding: 10px; border-radius: 4px; font-size: 14px; cursor: pointer; text-align: center; font-weight: bold; transition: all 0.2s; }
    .action-btn:hover { background: rgba(212, 175, 55, 0.3); color: #fff; }
    .action-btn.small { flex: 0 0 auto; padding: 6px 10px; font-size: 12px; font-weight: normal; }
    .action-btn.close-btn { background: rgba(255, 255, 255, 0.05); color: #ccc; border-color: rgba(255, 255, 255, 0.2); }
    .action-btn.close-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    .actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }

    /* Ultralight has no alert(); every message is shown in this line instead. */
    .status {
      min-height: 18px;
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      color: #9ad29a;
    }
    .status.warn { color: #ffcf6b; }
  </style>
</head>
<body>

<div class="bank-panel" id="bankPanel">
  <div class="title">화이트런 은행 업무</div>

  <div class="content" id="paramContainer">
    <div class="stat-row">
      <span class="stat-name">내 지갑 잔고</span>
      <span class="stat-value" id="valWallet">0 G</span>
    </div>
    <div class="stat-row">
      <span class="stat-name">은행 예금 잔고</span>
      <span class="stat-value" id="valBalance">0 G</span>
    </div>
    <div class="stat-row">
      <span class="stat-name">대출금</span>
      <span class="stat-value negative" id="valDebt">0 G</span>
    </div>
    <div class="stat-row">
      <span class="stat-name">상인 외상금</span>
      <span class="stat-value negative" id="valCreditDebt">0 G</span>
    </div>
  </div>

  <div class="input-section">
    <input type="text" id="amountInput" class="amount-input" placeholder="금액 입력" autofocus>
    <div class="btn-row">
      <button class="action-btn small" onclick="addAmount(10)">+10</button>
      <button class="action-btn small" onclick="addAmount(100)">+100</button>
      <button class="action-btn small" onclick="addAmount(1000)">+1000</button>
      <button class="action-btn small" onclick="clearAmount()">지움</button>
    </div>
    <div class="btn-row">
      <button class="action-btn small" onclick="fillAll('wallet')">지갑 전액</button>
      <button class="action-btn small" onclick="fillAll('balance')">예금 전액</button>
    </div>
    <div class="btn-row">
      <button class="action-btn" onclick="handleTransaction('deposit')">입금하기</button>
      <button class="action-btn" onclick="handleTransaction('withdraw')">출금하기</button>
    </div>
  </div>

  <div class="status" id="statusLine"></div>

  <div class="actions">
    <button class="action-btn" onclick="sendAction('payCredit')">상인 외상값 상환</button>
    <button class="action-btn" onclick="sendAction('sellBond')">채권 매각 (서드파티 연동)</button>
    <button class="action-btn close-btn" onclick="sendAction('close')">닫기</button>
  </div>
</div>

<script>
  var state = { wallet: 0, balance: 0, debt: 0, creditDebt: 0 };

  function setStatus(text, isWarning) {
    var el = document.getElementById('statusLine');
    el.innerText = text || '';
    el.className = isWarning ? 'status warn' : 'status';
  }

  // The SKSE plugin exposes this with RegisterJSListener(view, "bankAction", ...).
  function sendAction(actionName, amount) {
    var payload = (amount > 0) ? (actionName + ':' + amount) : actionName;
    if (typeof window.bankAction === 'function') {
      window.bankAction(payload);
    } else {
      setStatus('게임과 연결되지 않았습니다.', true);
    }
  }

  function handleTransaction(type) {
    var input = document.getElementById('amountInput');
    var amount = currentAmount();

    if (amount <= 0) {
      setStatus('금액을 입력해 주세요.', true);
      return;
    }
    // Papyrus does the authoritative check; this only avoids a pointless round trip.
    var available = (type === 'deposit') ? state.wallet : state.balance;
    if (amount > available) {
      setStatus(type === 'deposit' ? '지갑에 골드가 부족합니다.' : '예금 잔고가 부족합니다.', true);
      return;
    }

    sendAction(type, amount);
    input.value = '';
  }

  function currentAmount() {
    var v = parseInt(document.getElementById('amountInput').value, 10);
    return isNaN(v) ? 0 : v;
  }

  // Buttons keep the panel usable even where the field cannot be typed into.
  function addAmount(delta) {
    document.getElementById('amountInput').value = currentAmount() + delta;
    setStatus('');
  }

  function clearAmount() {
    document.getElementById('amountInput').value = '';
    setStatus('');
  }

  function fillAll(source) {
    var value = (source === 'wallet') ? state.wallet : state.balance;
    document.getElementById('amountInput').value = value > 0 ? value : '';
    setStatus('');
  }

  var amountEl = document.getElementById('amountInput');

  amountEl.addEventListener('input', function () {
    var digits = amountEl.value.replace(/[^0-9]/g, '');
    if (digits !== amountEl.value) { amountEl.value = digits; }
  });

  amountEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { handleTransaction('deposit'); }
  });

  try { amountEl.focus(); } catch (e) { /* focus is best-effort */ }

  window.bankUpdateParams = function (jsonString) {
    try {
      var data = (typeof jsonString === 'string') ? JSON.parse(jsonString) : jsonString;

      if (data.wallet !== undefined) { state.wallet = data.wallet; document.getElementById('valWallet').innerText = data.wallet + ' G'; }
      if (data.balance !== undefined) { state.balance = data.balance; document.getElementById('valBalance').innerText = data.balance + ' G'; }
      if (data.debt !== undefined) { state.debt = data.debt; document.getElementById('valDebt').innerText = data.debt + ' G'; }
      if (data.creditDebt !== undefined) { state.creditDebt = data.creditDebt; document.getElementById('valCreditDebt').innerText = data.creditDebt + ' G'; }
      if (data.message !== undefined) { setStatus(data.message, false); }
    } catch (e) {
      setStatus('데이터를 읽지 못했습니다.', true);
    }
  };
</script>
</body>
</html>
