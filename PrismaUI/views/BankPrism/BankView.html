<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --gold: #d4af37;
      --gold-dim: #8c7a33;
      --ink: #0d1014;
      --text: #ddd8cc;
      --muted: #9a9284;
      --good: #7fc97f;
      --bad: #ff9b9b;
      --line: rgba(212, 175, 55, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: 'Malgun Gothic', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* The hold's art sits behind everything at low opacity, with a scrim over it so
       text stays readable whatever the artwork happens to be. */
    .shell {
      position: relative;
      width: 860px;
      height: 560px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.85);
      background: var(--ink);
    }

    .art {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.30;
    }

    .scrim {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(180deg, rgba(8, 10, 13, 0.88) 0%, rgba(8, 10, 13, 0.62) 40%, rgba(8, 10, 13, 0.92) 100%);
    }

    .content {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ---- header ---- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand .hold { color: var(--gold); font-size: 20px; font-weight: bold; letter-spacing: 1px; }
    .brand .sub { color: var(--muted); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }

    .purse { text-align: right; }
    .purse .label { color: var(--muted); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
    .purse .value { color: var(--text); font-size: 18px; font-weight: bold; }

    /* ---- tabs ---- */
    .tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); }

    .tab {
      padding: 10px 18px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      border: 1px solid transparent;
      border-bottom: none;
      letter-spacing: 1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--gold);
      border-color: var(--line);
      background: rgba(212, 175, 55, 0.07);
    }

    /* ---- panels ---- */
    .panels { flex: 1; padding: 16px 22px; overflow: hidden; }
    .panel { display: none; height: 100%; }
    .panel.active { display: flex; flex-direction: column; }

    .figure-row { display: flex; gap: 14px; margin-bottom: 14px; }
    .figure {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.35);
    }
    .figure .label { color: var(--muted); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
    .figure .value { font-size: 22px; font-weight: bold; color: var(--text); }
    .figure .value.negative { color: var(--bad); }

    .amount-display {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 22px;
      font-weight: bold;
      text-align: right;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .amount-display .unit { font-size: 13px; color: var(--gold-dim); margin-left: 4px; }

    .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }

    .action-btn {
      flex: 1;
      background: rgba(212, 175, 55, 0.13);
      color: var(--gold);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 9px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }
    .action-btn:hover { background: rgba(212, 175, 55, 0.28); color: #fff; }
    .action-btn.small { padding: 6px 8px; font-size: 12px; font-weight: normal; }
    .action-btn.close-btn { background: rgba(255, 255, 255, 0.05); color: #ccc; border-color: rgba(255, 255, 255, 0.2); }
    .action-btn.close-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    .note { color: var(--muted); font-size: 12px; line-height: 1.7; }

    /* ---- ledger ---- */
    .ledger { flex: 1; overflow-y: auto; font-size: 13px; }
    .ledger-empty { color: #6b6459; font-size: 12px; padding: 8px 0; }
    .ledger-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .ledger-kind { color: var(--muted); }
    .ledger-amount.in { color: var(--good); }
    .ledger-amount.out { color: var(--bad); }
    .ledger-after { color: #6b6459; font-size: 11px; margin-left: 10px; }

    /* ---- footer ---- */
    .footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 22px 14px;
      border-top: 1px solid var(--line);
    }
    .status { flex: 1; font-size: 12px; color: var(--good); }
    .status.warn { color: #ffcf6b; }
    .footer .action-btn { flex: 0 0 120px; }
  </style>
</head>
<body>

<div class="shell">
  <div class="art" id="art"></div>
  <div class="scrim"></div>

  <div class="content">

    <div class="topbar">
      <div class="brand">
        <span class="hold" id="holdName">화이트런</span>
        <span class="sub">은행</span>
      </div>
      <div class="purse">
        <div class="label">소지금</div>
        <div class="value" id="valWallet">0 G</div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-deposit" onclick="showTab('deposit')">예금</div>
      <div class="tab" id="tab-loan" onclick="showTab('loan')">대출</div>
      <div class="tab" id="tab-credit" onclick="showTab('credit')">외상</div>
      <div class="tab" id="tab-ledger" onclick="showTab('ledger')">기록</div>
    </div>

    <div class="panels">

      <!-- 예금 -->
      <div class="panel active" id="panel-deposit">
        <div class="figure-row">
          <div class="figure">
            <div class="label">예금 잔고</div>
            <div class="value" id="valBalance">0 G</div>
          </div>
          <div class="figure">
            <div class="label">소지금</div>
            <div class="value" id="valWallet2">0 G</div>
          </div>
        </div>

        <div class="amount-display"><span id="amountText">0</span><span class="unit">G</span></div>

        <div class="btn-row">
          <button class="action-btn small" onclick="addAmount(10)">+10</button>
          <button class="action-btn small" onclick="addAmount(100)">+100</button>
          <button class="action-btn small" onclick="addAmount(1000)">+1,000</button>
          <button class="action-btn small" onclick="addAmount(10000)">+10,000</button>
          <button class="action-btn small" onclick="setAmount(0)">지움</button>
        </div>
        <div class="btn-row">
          <button class="action-btn small" onclick="fillAll('wallet')">지갑 전액</button>
          <button class="action-btn small" onclick="fillAll('balance')">예금 전액</button>
        </div>
        <div class="btn-row">
          <button class="action-btn" onclick="handleTransaction('deposit')">입금하기</button>
          <button class="action-btn" onclick="handleTransaction('withdraw')">출금하기</button>
        </div>
      </div>

      <!-- 대출 -->
      <div class="panel" id="panel-loan">
        <div class="figure-row">
          <div class="figure">
            <div class="label">남은 채무</div>
            <div class="value negative" id="valDebt">0 G</div>
          </div>
          <div class="figure">
            <div class="label">대출 한도</div>
            <div class="value" id="valLoanLimit">0 G</div>
          </div>
          <div class="figure">
            <div class="label">만기</div>
            <div class="value" id="valLoanDue">—</div>
          </div>
        </div>

        <div class="amount-display"><span id="amountText2">0</span><span class="unit">G</span></div>

        <div class="btn-row">
          <button class="action-btn small" onclick="addAmount(100)">+100</button>
          <button class="action-btn small" onclick="addAmount(1000)">+1,000</button>
          <button class="action-btn small" onclick="addAmount(10000)">+10,000</button>
          <button class="action-btn small" onclick="fillAll('limit')">한도 전액</button>
          <button class="action-btn small" onclick="setAmount(0)">지움</button>
        </div>
        <div class="btn-row">
          <button class="action-btn" onclick="sendAmountAction('borrow')">대출받기</button>
          <button class="action-btn" onclick="sendAmountAction('repay')">상환하기</button>
        </div>

        <div class="note" id="loanNote">
          한도는 도바킨의 행적에 따릅니다. 이름 없는 칼잡이에게 내어줄 돈은 없습니다.
        </div>
      </div>

      <!-- 외상 -->
      <div class="panel" id="panel-credit">
        <div class="figure-row">
          <div class="figure">
            <div class="label">외상금</div>
            <div class="value negative" id="valCreditDebt">0 G</div>
          </div>
        </div>
        <div class="note">
          외상은 이 홀드의 잡화상에게 직접 청해야 합니다.<br>
          장부에 오를 때 20%가 가산되며, 이후 늘어나지는 않습니다.<br>
          상환은 소지금부터, 모자라면 예금에서 빠집니다.
        </div>
        <div class="btn-row" style="margin-top: 14px;">
          <button class="action-btn" onclick="sendAction('payCredit')">외상값 상환</button>
          <button class="action-btn" onclick="sendAction('sellBond')">채권 매각</button>
        </div>
      </div>

      <!-- 기록 -->
      <div class="panel" id="panel-ledger">
        <div class="ledger" id="txLog">
          <div class="ledger-empty">아직 거래가 없습니다.</div>
        </div>
      </div>

    </div>

    <div class="footer">
      <div class="status" id="statusLine"></div>
      <button class="action-btn close-btn" onclick="sendAction('close')">닫기</button>
    </div>

  </div>
</div>

<script>
  var state = { wallet: 0, balance: 0, debt: 0, creditDebt: 0, loanLimit: 0, loanDaysLeft: 0 };
  var amount = 0;
  var entries = [];
  var currentTab = 'deposit';

  function comma(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function setStatus(text, isWarning) {
    var el = document.getElementById('statusLine');
    el.innerText = text || '';
    el.className = isWarning ? 'status warn' : 'status';
  }

  var TABS = ['deposit', 'loan', 'credit', 'ledger'];

  function showTab(name) {
    currentTab = name;
    for (var i = 0; i < TABS.length; i++) {
      var t = TABS[i];
      document.getElementById('tab-' + t).className = (t === name) ? 'tab active' : 'tab';
      document.getElementById('panel-' + t).className = (t === name) ? 'panel active' : 'panel';
    }
  }

  /* The amount is chosen with buttons, never typed: Skyrim does not deliver keyboard
     input to the view while the game is paused. */
  function setAmount(value) {
    amount = value < 0 ? 0 : value;
    var shown = comma(amount);
    setText('amountText', shown);
    setText('amountText2', shown);
    setStatus('');
  }

  function addAmount(delta) { setAmount(amount + delta); }

  function fillAll(source) {
    if (source === 'wallet') { setAmount(state.wallet); }
    else if (source === 'limit') { setAmount(state.loanLimit); }
    else { setAmount(state.balance); }
  }

  // Papyrus does the authoritative check on all of these; the guards here only avoid
  // a pointless round trip and give an immediate reason.
  function sendAmountAction(action) {
    if (action === 'borrow') {
      if (state.debt > 0) { setStatus('이미 갚지 않은 대출이 있습니다.', true); return; }
      if (state.loanLimit <= 0) { setStatus('아직 대출을 받을 수 없습니다.', true); return; }
      if (amount <= 0) { setStatus('금액을 선택해 주세요.', true); return; }
      if (amount > state.loanLimit) { setStatus('대출 한도를 넘습니다.', true); return; }
    } else if (action === 'repay') {
      if (state.debt <= 0) { setStatus('갚을 대출이 없습니다.', true); return; }
    }
    sendAction(action, amount);
  }

  // Exposed by the SKSE plugin via RegisterJSListener(view, "bankAction", ...).
  function sendAction(actionName, value) {
    var payload = (value > 0) ? (actionName + ':' + value) : actionName;
    if (typeof window.bankAction === 'function') {
      window.bankAction(payload);
    } else {
      setStatus('게임과 연결되지 않았습니다.', true);
    }
  }

  function handleTransaction(type) {
    if (amount <= 0) {
      setStatus('금액을 선택해 주세요.', true);
      return;
    }
    // Papyrus does the authoritative check; this only avoids a pointless round trip.
    var available = (type === 'deposit') ? state.wallet : state.balance;
    if (amount > available) {
      setStatus(type === 'deposit' ? '지갑에 골드가 부족합니다.' : '예금 잔고가 부족합니다.', true);
      return;
    }
    sendAction(type, amount);
  }

  var LABELS = { deposit: '입금', withdraw: '출금', payCredit: '외상 상환', borrow: '대출', repay: '대출 상환' };
  var INFLOW = { deposit: false, withdraw: true, payCredit: false, borrow: true, repay: false };

  // Only this session's transactions; nothing is written to the save.
  function addEntry(type, value, balanceAfter) {
    entries.unshift({ type: type, value: value, after: balanceAfter });
    if (entries.length > 12) { entries.pop(); }

    var log = document.getElementById('txLog');
    log.innerHTML = '';
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var gain = INFLOW[e.type];
      var row = document.createElement('div');
      row.className = 'ledger-row';
      row.innerHTML =
        '<span class="ledger-kind">' + (LABELS[e.type] || e.type) + '</span>' +
        '<span><span class="ledger-amount ' + (gain ? 'in' : 'out') + '">' +
        (gain ? '+' : '-') + comma(e.value) + ' G</span>' +
        '<span class="ledger-after">예금 ' + comma(e.after) + ' G</span></span>';
      log.appendChild(row);
    }
  }

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) { el.innerText = text; }
  }

  window.bankUpdateParams = function (jsonString) {
    try {
      var data = (typeof jsonString === 'string') ? JSON.parse(jsonString) : jsonString;

      // Accounts are per hold; the speaker decides which hold this panel shows.
      if (data.hold !== undefined) { setText('holdName', data.hold); }
      if (data.holdKey !== undefined) {
        document.getElementById('art').style.backgroundImage = "url('bg/" + data.holdKey + ".jpg')";
      }

      if (data.wallet !== undefined) {
        state.wallet = data.wallet;
        setText('valWallet', comma(data.wallet) + ' G');
        setText('valWallet2', comma(data.wallet) + ' G');
      }
      if (data.balance !== undefined) { state.balance = data.balance; setText('valBalance', comma(data.balance) + ' G'); }
      if (data.debt !== undefined) { state.debt = data.debt; setText('valDebt', comma(data.debt) + ' G'); }
      if (data.creditDebt !== undefined) { state.creditDebt = data.creditDebt; setText('valCreditDebt', comma(data.creditDebt) + ' G'); }
      if (data.loanLimit !== undefined) {
        state.loanLimit = data.loanLimit;
        setText('valLoanLimit', comma(data.loanLimit) + ' G');
      }
      if (data.loanDaysLeft !== undefined) {
        state.loanDaysLeft = data.loanDaysLeft;
        var due;
        if (state.debt <= 0) { due = '—'; }
        else if (data.loanDaysLeft < 0) { due = (-data.loanDaysLeft) + '일 연체'; }
        else { due = data.loanDaysLeft + '일 남음'; }
        setText('valLoanDue', due);
      }
      if (state.loanLimit <= 0) {
        setText('loanNote', '한도는 도바킨의 행적에 따릅니다. 이름 없는 칼잡이에게 내어줄 돈은 없습니다.');
      } else if (state.loanDaysLeft < 0 && state.debt > 0) {
        setText('loanNote', '기한이 지났습니다. 매주 원금의 일부가 더해지고, 배달부가 계속 찾아옵니다.');
      } else {
        setText('loanNote', '대출에는 서명할 때 한 번 가산이 붙습니다. 기한을 넘기면 매주 더해집니다.');
      }
      if (data.message !== undefined) { setStatus(data.message, false); }

      if (data.txType) {
        addEntry(data.txType, data.txAmount || 0, state.balance);
        setAmount(0);
      }
    } catch (e) {
      setStatus('데이터를 읽지 못했습니다.', true);
    }
  };
</script>
</body>
</html>
